<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rtkrcv</title>
<style>
:root {
  --bg: #f4f5f7; --surface: #ffffff; --sunken: #f0f2f5; --ink: #1a2330; --muted: #657084;
  --line: #e1e5ea; --accent: #0b7a70; --accent-ink: #ffffff; --accent-soft: #e2f3f0;
  --ok: #1a8a4c; --warn: #a15c00; --warn-soft: #fdf1dc; --bad: #c0362c; --bad-soft: #fde9e6;
  --changed: #fff6d9; --changed-line: #e2b93b;
  --series-1: #257de0; --grid: #e7e9ee; --axis: #c2c7cf;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1217; --surface: #161b22; --sunken: #1c222b; --ink: #e5e9ef; --muted: #93a0b2;
    --line: #272f3a; --accent: #35c9b6; --accent-ink: #06201c; --accent-soft: #12332f;
    --ok: #4fce85; --warn: #f0b354; --warn-soft: #33270f; --bad: #ff7b6e; --bad-soft: #3a1b18;
    --changed: #332b10; --changed-line: #b08d1f;
    --series-1: #338ced; --grid: #262d37; --axis: #47505c;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); }
button, input, select { font: inherit; color: inherit; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }

header {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { font-weight: 700; font-size: 16px; letter-spacing: -.01em; }
.conf { min-width: 0; flex: 1 1 200px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conf b { color: var(--ink); font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border-radius: 999px;
  background: var(--sunken); color: var(--muted); font-weight: 600; font-size: 12.5px; white-space: nowrap; }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pill.run { background: var(--accent-soft); color: var(--accent); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 7px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn:disabled { opacity: .45; cursor: default; border-color: var(--line); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--bad); }
.btn.small { padding: 3px 9px; font-size: 12.5px; }
.btn:focus-visible, input:focus-visible, select:focus-visible, .nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.layout { display: grid; grid-template-columns: 216px minmax(0, 1fr); gap: 20px; max-width: 1240px; margin: 0 auto; padding: 18px 16px 96px; }
.nav { position: sticky; top: 66px; align-self: start; display: flex; flex-direction: column; gap: 2px; }
.nav input { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); margin-bottom: 8px; }
.nav .label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding: 12px 10px 4px; }
.nav button { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; text-align: left;
  border: 0; background: none; padding: 7px 10px; border-radius: 7px; cursor: pointer; }
.nav button:hover { background: var(--sunken); }
.nav button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.badge { background: var(--changed-line); color: #1a1400; border-radius: 999px; font-size: 11px; font-weight: 700; padding: 0 7px; }

h2 { font-size: 18px; margin: 0 0 4px; letter-spacing: -.01em; }
h3 { font-size: 13px; margin: 0; }
.sub { color: var(--muted); margin: 0 0 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 16px; overflow: hidden; }
.panel > .head { display: flex; align-items: baseline; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.panel > .head span { color: var(--muted); font-size: 12.5px; }
.panel.off > .head { border-bottom: 0; }
.panel.off .field:not(.type) { display: none; }
.panel.off .field.type { border-top: 1px solid var(--line); }

.field { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 4px 16px; padding: 9px 14px; border-top: 1px solid var(--line); align-items: start; }
.panel > .field:first-child, .head + .field { border-top: 0; }
.field .k { font-family: var(--mono); font-size: 12.5px; padding-top: 6px; overflow-wrap: anywhere; }
.field .k small { display: block; color: var(--muted); font-family: var(--sans); font-size: 11px; }
.field.changed { background: var(--changed); box-shadow: inset 3px 0 0 var(--changed-line); }
.ctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ctl input[type=text], .ctl select { width: 100%; max-width: 520px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); font-family: var(--mono); font-size: 12.5px; }
.ctl select { max-width: 260px; }
.ctl .unit { color: var(--muted); font-size: 12.5px; }
.ctl.withunit input[type=text] { max-width: 260px; }
.flags { display: flex; flex-wrap: wrap; gap: 6px; }
.flags label { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 7px; padding: 4px 9px; cursor: pointer; font-family: var(--mono); font-size: 12.5px; background: var(--surface); }
.flags label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.meta { grid-column: 2; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.meta:empty { display: none; }
.warnt { color: var(--bad); font-weight: 600; }
.meta a { color: var(--accent); cursor: pointer; text-decoration: underline; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; margin-bottom: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.card .t { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; }
.card .v { font-size: 20px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.card .v.mono { font-family: var(--mono); font-size: 17px; font-weight: 600; }
.card .s { color: var(--muted); font-size: 12px; margin-top: 2px; }
.v.ok { color: var(--ok); } .v.warn { color: var(--warn); } .v.dim { color: var(--muted); }

.panel > details { border-top: 1px solid var(--line); }
.filters { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.filters .lbl { color: var(--muted); font-size: 12.5px; margin-right: 4px; }
.filters .sp { flex: 1; }
.seg { border: 1px solid var(--line); background: var(--surface); padding: 4px 10px; border-radius: 7px; cursor: pointer; font-size: 12.5px; }
.seg:hover { border-color: var(--muted); }
.seg.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.charts { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 16px 24px; padding: 14px; }
figure { margin: 0; min-width: 0; }
figcaption { font-size: 12.5px; font-weight: 600; margin-bottom: 8px; }
figcaption span { font-weight: 400; color: var(--muted); margin-left: 6px; }
canvas.chart { display: block; width: 100%; border-radius: 6px; touch-action: pan-y; }
canvas.chart:focus-visible, .sky circle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#cvTrack { aspect-ratio: 1 / 1; }
#cvSeries { height: 340px; }
.satwrap { display: grid; grid-template-columns: 372px minmax(0, 1fr); gap: 16px; align-items: start; }
.satwrap > div:empty { display: none; }
.sky svg { display: block; width: 100%; max-width: 340px; margin: 6px auto 0; }
.sky circle[data-sat] { cursor: default; outline: none; }
.legend { display: flex; gap: 6px 16px; flex-wrap: wrap; justify-content: center; font-size: 12px; padding: 4px 14px 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; box-sizing: border-box; }
.legend i.used { background: var(--series-1); }
.legend i.unused { border: 1.5px solid var(--muted); }
.sysnote { color: var(--muted); font-size: 11.5px; text-align: center; padding: 0 14px 12px; }
.tip { position: fixed; z-index: 20; pointer-events: none; display: none; min-width: 130px; padding: 8px 10px; border-radius: 8px;
  background: var(--surface); border: 1px solid var(--line); box-shadow: 0 6px 20px rgba(0,0,0,.2); font-size: 12px; }
.tip .tt { color: var(--muted); margin-bottom: 4px; }
.tip .row { display: flex; align-items: center; gap: 6px; }
.tip .row b { font-variant-numeric: tabular-nums; }
.tip .row .lab { color: var(--muted); }
.tip .key { width: 12px; height: 2px; border-radius: 1px; background: var(--series-1); flex: none; }
.tip .ft { color: var(--muted); margin-top: 4px; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { text-align: left; padding: 6px 12px; border-top: 1px solid var(--line); white-space: nowrap; }
thead th { border-top: 0; color: var(--muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
td.mono { font-family: var(--mono); }
td.wrap { white-space: normal; overflow-wrap: break-word; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
.dot.C { background: var(--ok); } .dot.E { background: var(--bad); }
.okc { color: var(--ok); font-weight: 600; }

.note { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; background: var(--surface); }
.note.warn { background: var(--warn-soft); border-color: transparent; }
.note.bad { background: var(--bad-soft); border-color: transparent; }
.note h3 { margin-bottom: 4px; }
.note .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 6px; flex-wrap: wrap; }
.note pre { margin: 8px 0 0; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.empty { text-align: center; padding: 44px 16px; color: var(--muted); }
.empty h2 { color: var(--ink); }
.empty .btn { margin-top: 14px; }
details > summary { cursor: pointer; padding: 10px 14px; font-weight: 600; font-size: 13px; }

.savebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: none; justify-content: center; padding: 12px 16px; pointer-events: none; }
.savebar.show { display: flex; }
.savebar > div { pointer-events: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--surface);
  border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; box-shadow: 0 8px 28px rgba(0,0,0,.18); max-width: 100%; }
.savebar .msg { font-weight: 600; margin-right: 6px; }
.toast { position: fixed; top: 64px; right: 16px; z-index: 9; max-width: min(420px, calc(100vw - 32px)); padding: 10px 14px; border-radius: 9px;
  background: var(--ink); color: var(--bg); box-shadow: 0 8px 28px rgba(0,0,0,.25); display: none; overflow-wrap: anywhere; }
.toast.show { display: block; }
.toast.bad { background: var(--bad); color: #fff; }

@media (max-width: 800px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .conf { order: 9; flex-basis: 100%; }
  .nav { position: static; flex-direction: row; flex-wrap: nowrap; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
  .nav input { flex: 0 0 150px; margin: 0; }
  .nav .label { display: none; }
  .nav button { width: auto; white-space: nowrap; flex: 0 0 auto; }
  .field { grid-template-columns: minmax(0, 1fr); }
  .charts, .satwrap { grid-template-columns: minmax(0, 1fr); }
  #cvTrack { max-width: 420px; margin: 0 auto; }
  .field .k { padding-top: 0; }
  .meta { grid-column: 1; }
}
</style>
</head>
<body>
<header>
  <div class="brand">rtkrcv</div>
  <div class="conf" id="conf"></div>
  <span class="pill" id="pill">…</span>
  <button class="btn primary" id="bStart">Start</button>
  <button class="btn" id="bRestart">Restart</button>
  <button class="btn danger" id="bStop">Stop</button>
</header>
<div class="layout">
  <nav class="nav" id="nav"></nav>
  <main id="main"></main>
</div>
<div class="savebar" id="savebar"><div>
  <span class="msg" id="saveMsg"></span>
  <button class="btn" id="bDiscard">Discard</button>
  <button class="btn primary" id="bSave">Save</button>
  <button class="btn" id="bSaveRestart">Save and restart</button>
</div></div>
<div class="toast" id="toast"></div>
<div class="tip" id="tip" role="status"></div>

<script>
const TOKEN = "__TOKEN__";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const PATH_HELP = {
  serial: "port[:bit_rate[:byte[:parity(n|o|e)[:stopb[:fctr(off|on)]]]]]",
  file: "path — keywords %Y %m %d %h %M %S are replaced by the time; add ::S=hours to swap files",
  tcpsvr: ":port",
  tcpcli: "addr:port",
  ntripcli: "user:passwd@addr:port/mntpnt",
  ntripsvr: "user:passwd@addr:port/mntpnt[:str]",
  ftp: "user:passwd@addr/path",
  http: "addr/path",
};

const S = { conf: null, fields: {}, orig: {}, edits: {}, view: "monitor", q: "", run: null, busy: false,
            diskChanged: false, open: {}, html: {} };

async function api(path, body) {
  const opt = { headers: { "X-Token": TOKEN } };
  if (body !== undefined) { opt.method = "POST"; opt.body = JSON.stringify(body); opt.headers["Content-Type"] = "application/json"; }
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({ error: "bad response" }));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
let toastTimer;
function toast(msg, bad) {
  const t = $("toast"); t.textContent = msg; t.className = "toast show" + (bad ? " bad" : "");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = "toast", bad ? 7000 : 2600);
}

/* ---------- configuration ---------- */
function norm(f, v) {            // enum values as rtkrcv reads them, e.g. "1" -> "on"
  return f.kind === "enum" && f.canon ? f.canon : v;
}
function setConf(conf) {
  S.conf = conf; S.fields = {}; S.orig = {};
  for (const g of conf.groups) for (const f of g.fields) { S.fields[f.key] = f; S.orig[f.key] = norm(f, f.value); }
  for (const k of Object.keys(S.edits)) if (!(k in S.orig) || S.edits[k] === S.orig[k]) delete S.edits[k];
  S.diskChanged = false;
  const i = conf.path.lastIndexOf("/");
  $("conf").innerHTML = esc(conf.path.slice(0, i + 1)) + "<b>" + esc(conf.path.slice(i + 1)) + "</b>";
  $("conf").title = conf.path;
}
const val = k => (k in S.edits ? S.edits[k] : S.orig[k]);
function setVal(k, v) { if (v === S.orig[k]) delete S.edits[k]; else S.edits[k] = v; }
const nEdits = () => Object.keys(S.edits).length;

function control(f) {
  const v = val(f.key), id = "f-" + f.key;
  if (f.kind === "enum") {
    const names = f.choices.map(c => c.name);
    const opts = (names.includes(v) ? names : [v, ...names]).map(n => `<option${n === v ? " selected" : ""}>${esc(n)}</option>`).join("");
    return `<div class="ctl"><select id="${id}" data-key="${esc(f.key)}">${opts}</select></div>`;
  }
  if (f.kind === "flags") {
    const num = parseInt(v, 10) || 0;
    return `<div class="ctl"><div class="flags" data-flags="${esc(f.key)}">` + f.choices.filter(c => c.num > 0).map(c =>
      `<label><input type="checkbox" value="${c.num}"${num & c.num ? " checked" : ""}>${esc(c.name)}</label>`).join("") + `</div></div>`;
  }
  return `<div class="ctl${f.unit ? " withunit" : ""}"><input type="text" id="${id}" data-key="${esc(f.key)}" value="${esc(v)}" spellcheck="false" autocomplete="off">` +
    (f.unit ? `<span class="unit">${esc(f.unit)}</span>` : "") + `</div>`;
}
function metaHtml(f) {
  const bits = [];
  if (f.key.endsWith("-path") && f.stream) {
    const h = PATH_HELP[val(f.stream + "-type")]; if (h) bits.push("Format: " + esc(h));
    if (/\$\{[^}]+\}/.test(val(f.key))) bits.push("${NAME} is filled in from the environment or the .env file at the top of the repository");
  }
  if (!f.known) bits.push(`<span class="warnt">Not an option of this rtkrcv build — it is ignored</span>`);
  if (f.kind === "enum" && !f.choices.some(c => c.name === val(f.key)))
    bits.push(`<span class="warnt">Not a valid choice — rtkrcv ignores this line and keeps its default</span>`);
  if (f.note) bits.push(esc(f.note));
  if (f.kind === "flags") bits.push("value " + esc(val(f.key)));
  if (f.key in S.edits) bits.push(`was <code>${esc(S.orig[f.key] === "" ? "(empty)" : S.orig[f.key])}</code> · <a data-reset="${esc(f.key)}">reset</a>`);
  return bits.join(" · ");
}
function fieldHtml(f) {
  const suffix = f.key.split("-").slice(1).join("-");
  return `<div class="field${f.key in S.edits ? " changed" : ""}${f.stream && suffix === "type" ? " type" : ""}" data-field="${esc(f.key)}">
    <label class="k" for="f-${esc(f.key)}">${esc(f.key)}<small>line ${f.line}</small></label>${control(f)}<div class="meta">${metaHtml(f)}</div></div>`;
}
function groupHtml(g, fields) {
  if (!["inpstr", "outstr", "logstr"].includes(g.id)) return `<div class="panel">${fields.map(fieldHtml).join("")}</div>`;
  const by = {};
  for (const f of fields) (by[f.stream] = by[f.stream] || []).push(f);
  return Object.keys(by).map(s => {
    const off = val(s + "-type") === "off" && by[s].some(f => f.key === s + "-type");
    return `<div class="panel${off ? " off" : ""}" data-stream="${s}"><div class="head"><h3>${esc(S.conf.streams[s] || s)}</h3><span>${s}${off ? " · off" : ""}</span></div>${by[s].map(fieldHtml).join("")}</div>`;
  }).join("");
}
function renderConfig() {
  const q = S.q.trim().toLowerCase();
  let html = "";
  if (q) {
    const hit = f => (f.key + " " + val(f.key) + " " + f.note + " " + f.unit + " " + f.choices.map(c => c.name).join(" ")).toLowerCase().includes(q);
    let n = 0;
    for (const g of S.conf.groups) {
      const fs = g.fields.filter(hit); if (!fs.length) continue;
      n += fs.length; html += `<p class="sub" style="margin:0 0 6px"><b>${esc(g.title)}</b></p>` + groupHtml(g, fs);
    }
    html = `<h2>Search</h2><p class="sub">${n} option${n === 1 ? "" : "s"} matching “${esc(S.q.trim())}”</p>` + (html || `<div class="note">Nothing matches.</div>`);
  } else {
    const g = S.conf.groups.find(g => g.id === S.view) || S.conf.groups[0];
    html = `<h2>${esc(g.title)}</h2><p class="sub">${g.fields.length} options · saved straight to the options file</p>` + groupHtml(g, g.fields);
  }
  $("main").innerHTML = html;
}
function refreshField(key) {
  const el = document.querySelector(`[data-field="${CSS.escape(key)}"]`); if (!el) return;
  const f = S.fields[key];
  el.classList.toggle("changed", key in S.edits);
  el.querySelector(".meta").innerHTML = metaHtml(f);
}
function afterEdit(key, rerender) {
  const f = S.fields[key];
  if (rerender || (f.stream && key.endsWith("-type"))) renderConfig(); else refreshField(key);
  renderNav(); renderSaveBar();
}

/* ---------- navigation and save bar ---------- */
function renderNav() {
  const counts = {};
  if (S.conf) for (const g of S.conf.groups) counts[g.id] = g.fields.filter(f => f.key in S.edits).length;
  let h = `<input id="q" type="search" placeholder="Search options" value="${esc(S.q)}" aria-label="Search options">`;
  h += `<button data-view="monitor" class="${!S.q && S.view === "monitor" ? "on" : ""}">Monitor</button><div class="label">Configuration</div>`;
  if (S.conf) for (const g of S.conf.groups)
    h += `<button data-view="${g.id}" class="${!S.q && S.view === g.id ? "on" : ""}"><span>${esc(g.title)}</span>${counts[g.id] ? `<span class="badge">${counts[g.id]}</span>` : ""}</button>`;
  const nav = $("nav"), had = document.activeElement && document.activeElement.id === "q", pos = had ? document.activeElement.selectionStart : 0;
  nav.innerHTML = h;
  if (had) { const q = $("q"); q.focus(); q.setSelectionRange(pos, pos); }
}
function renderSaveBar() {
  const n = nEdits();
  $("savebar").classList.toggle("show", n > 0 || S.diskChanged);
  $("saveMsg").textContent = S.diskChanged && n ? `${n} unsaved change${n === 1 ? "" : "s"} · file also changed on disk`
    : S.diskChanged ? "The options file changed on disk" : `${n} unsaved change${n === 1 ? "" : "s"}`;
  $("bSave").style.display = n ? "" : "none";

  const key = JSON.stringify([list, mask, K.series, K.ink, K.surface]);
  const nUsed = list.filter(s => s.used).length;
  $("skySub").textContent = `${nUsed} used · ${list.length - nUsed} not used`;
  if (key === T.skyKey && svg.childNodes.length) return;
  T.skyKey = key; T.sky = list;
  const cx = 170, cy = 170, R = 134, rad = el => R * (90 - el) / 90, frag = document.createDocumentFragment();
  const add = (n, a, t) => frag.appendChild(svgEl(n, a, t));
  for (const el of [60, 30, 0]) add("circle", { cx, cy, r: rad(el), fill: "none", stroke: el ? K.grid : K.axis, "stroke-width": 1 });
  add("path", { d: `M${cx} ${cy - R}V${cy + R}M${cx - R} ${cy}H${cx + R}`, stroke: K.grid, "stroke-width": 1, fill: "none" });
  if (mask > 0 && mask < 90) {
    add("circle", { cx, cy, r: rad(mask), fill: "none", stroke: K.axis, "stroke-width": 1 });
    add("text", { x: cx - rad(mask) * .7071 - 3, y: cy + rad(mask) * .7071 + 11, "text-anchor": "end", "font-size": 10, fill: K.muted }, `mask ${mask}°`);
  }
  for (const el of [60, 30]) add("text", { x: cx + rad(el) * .7071 + 3, y: cy - rad(el) * .7071 - 3, "font-size": 10, fill: K.muted }, el + "°");
  [["N", cx, cy - R - 8], ["E", cx + R + 11, cy + 4], ["S", cx, cy + R + 17], ["W", cx - R - 11, cy + 4]].forEach(([t, x, y]) =>
    add("text", { x, y, "text-anchor": "middle", "font-size": 11, "font-weight": 600, fill: K.muted }, t));
  const P = list.map(s => { const r = rad(s.el), a = s.az * D2R; return [cx + r * Math.sin(a), cy - r * Math.cos(a)]; });
  const boxes = P.map(([x, y]) => [x - 7, y - 7, x + 7, y + 7]);
  for (const el of [60, 30]) { const x = cx + rad(el) * .7071 + 3, y = cy - rad(el) * .7071 - 3; boxes.push([x - 2, y - 10, x + 20, y + 3]); }   // keep the ring labels clear
  if (mask > 0 && mask < 90) { const x = cx - rad(mask) * .7071 - 3, y = cy + rad(mask) * .7071 + 11; boxes.push([x - 46, y - 10, x + 2, y + 3]); }
  const hits = b => boxes.some(o => b[0] < o[2] && b[2] > o[0] && b[1] < o[3] && b[3] > o[1]) || b[0] < 2 || b[2] > 338 || b[1] < 2 || b[3] > 338;
  list.forEach((s, i) => {
    const [x, y] = P[i];
    if (s.used) add("circle", { cx: x, cy: y, r: 5, fill: K.series, stroke: K.surface, "stroke-width": 2 });
    else add("circle", { cx: x, cy: y, r: 4.25, fill: K.surface, stroke: K.muted, "stroke-width": 1.5 });
    const tw = s.id.length * 6.4;              // label the mark where a free spot exists; the tooltip and table carry the rest
    for (const [lx, ly, anchor, b] of [
      [x + 9, y + 3.5, "start", [x + 8, y - 6, x + 9 + tw, y + 6]], [x - 9, y + 3.5, "end", [x - 9 - tw, y - 6, x - 8, y + 6]],
      [x, y - 9, "middle", [x - tw / 2, y - 20, x + tw / 2, y - 8]], [x, y + 17, "middle", [x - tw / 2, y + 8, x + tw / 2, y + 20]]]) {
      if (hits(b)) continue;
      boxes.push(b); add("text", { x: lx, y: ly, "text-anchor": anchor, "font-size": 10.5, fill: K.ink }, s.id); break;
    }
  });
  list.forEach((s, i) => add("circle", { cx: P[i][0], cy: P[i][1], r: 12, fill: "transparent", "data-sat": i, tabindex: 0, role: "img",
    "aria-label": `${s.id}, elevation ${s.el} degrees, azimuth ${s.az} degrees, ${s.used ? "used in the solution" : "not used"}` }));
  svg.replaceChildren(frag);
}
function tip(x, y, title, rows, foot) {      // values lead, labels follow; text is inserted with textContent only
  const t = $("tip"); t.replaceChildren();
  const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
  t.appendChild(mk("div", "tt", title));
  for (const [label, value, key] of rows) {
    const r = mk("div", "row"); if (key) r.appendChild(mk("span", "key"));
    r.appendChild(mk("b", "", value)); r.appendChild(mk("span", "lab", label)); t.appendChild(r);
  }
  if (foot) t.appendChild(mk("div", "ft", foot));
  t.style.display = "block";
  const w = t.offsetWidth, h = t.offsetHeight;
  t.style.left = Math.max(8, x + 14 + w > innerWidth ? x - w - 14 : x + 14) + "px";
  t.style.top = Math.max(8, y + 14 + h > innerHeight ? y - h - 14 : y + 14) + "px";
}
const hideTip = () => { $("tip").style.display = "none"; };
function tipPoint(i, x, y) {
  const W = T.win, p = W.pts[i];
  tip(x, y, hms(p[0]) + " GPST", [["m east", signed(W.e[i], 3), 1], ["m north", signed(W.nn[i], 3), 1], ["m up", signed(W.u[i], 3), 1]],
      `${p[4]} · ${p[5]} satellites`);
}
function tipSat(i, x, y) {
  const s = T.sky[i]; if (!s) return;
  tip(x, y, `${s.id} · ${SYS[s.id[0]] || "SBAS"}`, [["elevation", s.el.toFixed(1) + "°"], ["azimuth", s.az.toFixed(1) + "°"]], s.used ? "Used in the solution" : "Tracked, not used");
}
function selectAt(cv, e) {       // nearest solution to the pointer: by distance on the track, by time on the series
  const W = T.win; if (!W) return -1;
  const b = cv.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top;
  if (cv.id === "cvTrack" && T.geo.track) {
    let best = -1, bd = 24 * 24;
    for (let i = 0; i < W.n; i++) { const [px, py] = T.geo.track(i), d = (px - x) * (px - x) + (py - y) * (py - y); if (d <= bd) { bd = d; best = i; } }
    return best;
  }
  if (cv.id === "cvSeries" && T.geo.series) {
    const g = T.geo.series, t = g.t0 + (x - g.L) / g.pw * (g.t1 - g.t0);
    if (x < g.L - 12 || x > g.L + g.pw + 12) return -1;
    let best = 0; for (let i = 1; i < W.n; i++) if (Math.abs(W.pts[i][0] - t) < Math.abs(W.pts[best][0] - t)) best = i;
    return best;
  }
  return -1;
}
function setSel(i, x, y) {
  const W = T.win, t = W && i >= 0 ? W.pts[i][0] : null, changed = t !== T.sel;
  T.sel = t;
  if (changed) redrawHistory();
  if (i >= 0) tipPoint(i, x, y); else hideTip();
}
function redrawHistory() {
  const K = chartColors();
  drawTrack(T.win, K); drawSeries(T.win, K);
}
const chartColors = () => ({ series: cssv("--series-1"), grid: cssv("--grid"), axis: cssv("--axis"), ink: cssv("--ink"), muted: cssv("--muted"), surface: cssv("--surface") });
function drawCharts() {
  if (!$("cvTrack") && !$("sky")) return;
  const K = chartColors(), W = T.win = windowed();
  drawTrack(W, K); drawSeries(W, K); drawSky(K);
  const sub = $("histSub");
  if (sub) sub.textContent = W ? `${W.n} solution${W.n === 1 ? "" : "s"} · ${hms(W.pts[0][0])}–${hms(W.pts[W.n - 1][0])} GPST · mean ${W.ref[0].toFixed(7)}°, ${W.ref[1].toFixed(7)}°, ${W.ref[2].toFixed(2)} m` : "";
  const tb = $("histTable");
  if (tb && S.open.hist) {
    let h = `<table><thead><tr><th>Time (GPST)</th><th class="n">Latitude</th><th class="n">Longitude</th><th class="n">Height</th><th class="n">East</th><th class="n">North</th><th class="n">Up</th><th>Status</th><th class="n">Satellites</th></tr></thead><tbody>`;
    if (W) for (let i = W.n - 1; i >= Math.max(0, W.n - 30); i--) { const p = W.pts[i];
      h += `<tr><td class="mono">${hms(p[0])}</td><td class="n">${p[1].toFixed(8)}°</td><td class="n">${p[2].toFixed(8)}°</td><td class="n">${p[3].toFixed(3)} m</td><td class="n">${signed(W.e[i], 3)} m</td><td class="n">${signed(W.nn[i], 3)} m</td><td class="n">${signed(W.u[i], 3)} m</td><td>${esc(p[4])}</td><td class="n">${p[5]}</td></tr>`; }
    tb.innerHTML = h + `</tbody></table>`;
  }
}

/* ---------- events ---------- */
$("nav").addEventListener("click", e => { const b = e.target.closest("[data-view]"); if (!b) return; S.view = b.dataset.view; S.q = ""; history.replaceState(null, "", "#" + S.view); show(); window.scrollTo(0, 0); });
$("nav").addEventListener("input", e => { if (e.target.id === "q") { S.q = e.target.value; show(); } });
$("main").addEventListener("input", e => {
  const t = e.target;
  if (t.matches("input[type=text][data-key]")) { setVal(t.dataset.key, t.value.trim()); afterEdit(t.dataset.key); }
});
$("main").addEventListener("change", e => {
  const t = e.target;
  if (t.matches("select[data-key]")) { setVal(t.dataset.key, t.value); afterEdit(t.dataset.key); }
  const fl = t.closest("[data-flags]");
  if (fl) { let n = 0; fl.querySelectorAll("input:checked").forEach(c => n += +c.value); setVal(fl.dataset.flags, String(n)); afterEdit(fl.dataset.flags); }
});
$("main").addEventListener("click", e => {
  const t = e.target;
  if (t.dataset.range !== undefined) { T.range = +t.dataset.range; T.sel = null; hideTip(); renderMonitor(); }
  else if (t.dataset.reset) { delete S.edits[t.dataset.reset]; afterEdit(t.dataset.reset, true); }
  else if (t.dataset.act) act(t.dataset.act);
  else if (t.dataset.kill) act("stop-other", { pid: +t.dataset.kill });
});
$("main").addEventListener("toggle", e => { if (e.target.dataset && e.target.dataset.d) { S.open[e.target.dataset.d] = e.target.open; if (e.target.dataset.d === "hist") drawCharts(); } }, true);
/* graphs: hover and keyboard give the same readout */
$("main").addEventListener("pointermove", e => {
  const t = e.target;
  if (t.matches && t.matches("canvas.chart")) setSel(selectAt(t, e), e.clientX, e.clientY);
  else if (t.dataset && t.dataset.sat !== undefined) tipSat(+t.dataset.sat, e.clientX, e.clientY);
});
$("main").addEventListener("pointerleave", e => {
  const t = e.target;
  if (t.matches && t.matches("canvas.chart")) setSel(-1); else if (t.dataset && t.dataset.sat !== undefined) hideTip();
}, true);
$("main").addEventListener("focus", e => {
  const t = e.target;
  if (t.dataset && t.dataset.sat !== undefined) { const b = t.getBoundingClientRect(); tipSat(+t.dataset.sat, b.right, b.top); }
}, true);
$("main").addEventListener("blur", e => {
  const t = e.target;
  if (t.matches && t.matches("canvas.chart")) setSel(-1); else if (t.dataset && t.dataset.sat !== undefined) hideTip();
}, true);
$("main").addEventListener("keydown", e => {
  const t = e.target, W = T.win;
  if (!t.matches || !t.matches("canvas.chart") || !W) return;
  let i = selIndex(W);
  if (e.key === "ArrowLeft") i = i < 0 ? W.n - 1 : Math.max(0, i - 1);
  else if (e.key === "ArrowRight") i = i < 0 ? W.n - 1 : Math.min(W.n - 1, i + 1);
  else if (e.key === "Home") i = 0;
  else if (e.key === "End") i = W.n - 1;
  else if (e.key === "Escape") i = -1;
  else return;
  e.preventDefault();
  const b = t.getBoundingClientRect();
  let x = b.left + b.width / 2, y = b.top + 24;
  if (i >= 0 && t.id === "cvTrack" && T.geo.track) { const q = T.geo.track(i); x = b.left + q[0]; y = b.top + q[1]; }
  else if (i >= 0 && T.geo.series) x = b.left + T.geo.series.X(W.pts[i][0]);
  setSel(i, x, y);
});
window.addEventListener("resize", () => { if (!S.q && S.view === "monitor") drawCharts(); });
$("bStart").onclick = () => act("start");
$("bStop").onclick = () => act("stop");
$("bRestart").onclick = () => act("restart");
$("bSave").onclick = () => save(false);
$("bSaveRestart").onclick = () => save(true);
$("bDiscard").onclick = async () => { S.edits = {}; try { await loadConf(); } catch (e) { toast(e.message, true); } show(); };
window.addEventListener("keydown", e => { if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); save(false); } });
window.addEventListener("beforeunload", e => { if (nEdits()) { e.preventDefault(); e.returnValue = ""; } });

(async () => {
  try { await loadConf(); } catch (e) { toast(e.message, true); }
  const h = location.hash.slice(1);
  if (S.conf && S.conf.groups.some(g => g.id === h)) S.view = h;
  show(); poll();
})();
</script>
